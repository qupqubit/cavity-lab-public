[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cavity-lab-public"
version = "0.1.7"
description = "Local STEP-to-Maxwell FEM workbench for superconducting cavities"
requires-python = ">=3.9,<3.13"
dependencies = [
  "ngsolve==6.2.2506", "numpy>=1.26,<2.1", "scipy==1.13.1",
  "fastapi>=0.115,<0.129", "uvicorn>=0.30,<0.40", "python-multipart>=0.0.20,<0.1", "psutil==7.2.2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

[project.scripts]
cavity-lab-public = "cavity_fem.api:main"

[tool.setuptools]
packages = ["cavity_fem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
